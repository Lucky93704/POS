<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nawab Kurta - Expenses</title>
<style>
:root{--ink:#171717;--muted:#666;--line:#ddd;--gold:#b58a3b}
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:var(--ink);font:15px system-ui,-apple-system,sans-serif; padding-left: 80px;}
.app{max-width:760px;margin:22px auto;padding:16px}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
h2{font-size:17px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input{width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;font:inherit;}
input:focus{outline:2px solid #b58a3b;outline-offset:1px;border-color:#b58a3b}
button{border:0;border-radius:8px;padding:11px 14px;font:600 14px system-ui;cursor:pointer;transition:opacity 0.2s}
button:active{opacity:0.8}
.primary{background:#171717;color:#fff}.secondary{background:#eee;color:#171717}.danger{background:#fff0f0;color:#a00}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .actions button{flex:1;}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* SIDE NAVIGATION */
.side-nav {
  position: fixed; top: 0; left: 0; bottom: 0; background: #fff; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; padding: 20px 0; z-index: 2500; width: 80px; box-shadow: 2px 0 10px rgba(0,0,0,0.04);
}
.side-nav a {
  background: transparent; color: var(--muted); border: none; padding: 16px 0;
  font-size: 11px; font-weight: 600; display: flex; flex-direction: column; text-decoration: none;
  align-items: center; gap: 6px; cursor: pointer; width: 100%; transition: all 0.2s;
}
.side-nav a svg { width: 24px; height: 24px; fill: currentColor; }
.side-nav a.active { color: var(--ink); background: #f9f9f9; border-left: 3px solid var(--ink); }
.side-nav a:hover:not(.active) { background: #fafafa; color: #333; }

.history-entry{border-top:1px solid #eee;padding:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;}
.history-entry strong{display:block;font-size:14px;margin-bottom:2px}
.history-entry small{display:block;color:#666;font-size:12px}

.app-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:3000;background:#171717;color:#fff;padding:12px 18px;border-radius:999px;transition:opacity .22s,transform .22s;font-size:13px}
.app-toast.show{opacity:1;transform:translate(-50%,0)}
.app-confirm{position:fixed;inset:0;background:#0008;z-index:3100;display:flex;align-items:center;justify-content:center;padding:18px;}
.confirm-card{width:min(340px,100%);background:#fff;border-radius:18px;padding:22px;text-align:center;}

.app-confirm[hidden] { display: none !important; }

@media(max-width:600px){
  body { padding-left: 65px; } .side-nav { width: 65px; }
  .side-nav a { font-size: 10px; padding: 12px 0; } .side-nav a svg { width: 20px; height: 20px; }
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="side-nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span>
  </a>
  <a href="bill.html">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>New Bill</span>
  </a>
  <a href="history.html">
    <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg><span>History</span>
  </a>
  <a href="expense.html" class="active">
    <svg viewBox="0 0 24 24"><path d="M21.18 10.37l-1.45-1.45a7.95 7.95 0 0 0-1.74-7.18l-1.42 1.42a5.95 5.95 0 0 1 1.2 5.25l-2.02-2.02a7.95 7.95 0 0 0-7.18-1.74L7.12 3.19l-1.42 1.42a5.95 5.95 0 0 1 5.25 1.2l-2.02-2.02a7.95 7.95 0 0 0-1.74 7.18l-1.45 1.45L2 15l4 4 4-4-3.73-3.73a5.95 5.95 0 0 1 7.46 0L10 19l4 4 4-4-3.73-3.73a5.95 5.95 0 0 1 7.46 0L18 19l4 4 4-4-4.82-8.63zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg><span>Expenses</span>
  </a>
</nav>

<div class="app">
 <section class="panel">
  <h2>Add Shop Expense</h2>
  <div class="grid">
   <div><label>Date</label><input id="expDate" type="date"></div>
   <div><label>Amount (₹)</label><input id="expAmount" type="number" min="0" step="1" placeholder="e.g. 500"></div>
   <div style="grid-column: 1 / -1;"><label>Description / Category</label><input id="expDesc" placeholder="e.g. Electricity, Chai, Raw Material"></div>
  </div>
  <div class="actions"><button class="primary" id="saveExpenseBtn">Save Expense</button></div>
 </section>

 <section class="panel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
    <h2>Expense History</h2><div style="font-size:14px">Total: <strong id="expTotalSales">₹0.00</strong></div>
  </div>
  <div id="expenseList" class="note">No expenses saved yet.</div>
 </section>
</div>

<div id="appToast" class="app-toast"></div>
<div id="appConfirm" class="app-confirm" hidden>
 <div class="confirm-card"><h3 id="confirmTitle">Are you sure?</h3><p id="confirmMessage"></p><div class="confirm-actions"><button type="button" class="secondary" id="confirmCancel">Cancel</button><button type="button" class="primary" id="confirmOk">Continue</button></div></div>
</div>

<script>
const EXPENSE_KEY = 'nawabKurtaExpenses_v1';
const money=n=>'₹'+(Number(n)||0).toFixed(2);

const formatDate = (value) => {
  if(!value)return '';
  const parts=String(value).split('-');
  if(parts.length===3) return new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2])).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const d=new Date(value);
  return Number.isNaN(d.getTime())?String(value):d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
};

let toastTimer, confirmResolver;
function toast(msg){ const el=document.getElementById('appToast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400); }
function askConfirm(msg,title='Are you sure?',act='Continue'){ document.getElementById('confirmMessage').textContent=msg;document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmOk').textContent=act;document.getElementById('appConfirm').hidden=false;return new Promise(r=>{confirmResolver=r}); }
function closeConfirm(ans){ document.getElementById('appConfirm').hidden=true;if(confirmResolver)confirmResolver(ans);confirmResolver=null; }
document.getElementById('confirmCancel').onclick=()=>closeConfirm(false); document.getElementById('confirmOk').onclick=()=>closeConfirm(true);

function readExpenses() { try { return JSON.parse(localStorage.getItem(EXPENSE_KEY) || '[]'); } catch(e) { return []; } }
function writeExpenses(rows) { localStorage.setItem(EXPENSE_KEY, JSON.stringify(rows)); }

document.getElementById('expDate').value = new Date().toISOString().slice(0,10);

document.getElementById('saveExpenseBtn').onclick = () => {
  const date = document.getElementById('expDate').value, amount = Number(document.getElementById('expAmount').value), desc = document.getElementById('expDesc').value.trim();
  if (!amount || amount <= 0 || !desc) return toast('Please enter a valid amount and description.');
  const exp = { id: 'exp-' + Date.now(), date, amount, desc }, history = readExpenses();
  history.unshift(exp); 
  writeExpenses(history);
  if(window.cloudSyncExpenses) window.cloudSyncExpenses(history); // SYNC TO CLOUD
  document.getElementById('expAmount').value = ''; document.getElementById('expDesc').value = '';
  toast('Expense saved'); renderExpenses();
};

function renderExpenses() {
  const history = readExpenses(), list = document.getElementById('expenseList'), totalEl = document.getElementById('expTotalSales');
  if (!history.length) { list.textContent = 'No expenses saved.'; totalEl.textContent = money(0); return; }
  let total = 0; list.innerHTML = '';
  history.forEach(x => {
    total += x.amount; const row = document.createElement('div'); row.className = 'history-entry';
    row.innerHTML = `<div><strong>${x.desc} · ${money(x.amount)}</strong><small>${formatDate(x.date)}</small></div>`;
    const actions = document.createElement('div'); actions.className = 'actions';
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = 'Delete';
    del.onclick = async () => { 
      if(await askConfirm('Delete expense?')){ 
        const newHist = readExpenses().filter(y=>y.id!==x.id); 
        writeExpenses(newHist); 
        if(window.cloudSyncExpenses) window.cloudSyncExpenses(newHist); // SYNC TO CLOUD
        renderExpenses(); 
        toast('Deleted'); 
      } 
    };
    actions.append(del); row.append(actions); list.append(row);
  });
  totalEl.textContent = money(total);
}
renderExpenses();
</script>

<!-- FIREBASE REALTIME SYNC (EXPENSES) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  
  const firebaseConfig = {
    apiKey: "AIzaSyCU9P4z-hBu7sho7tT55GkLBANsd2Ghs-w",
    authDomain: "pos-app-cf53e.firebaseapp.com",
    projectId: "pos-app-cf53e",
    storageBucket: "pos-app-cf53e.firebasestorage.app",
    messagingSenderId: "956442371301",
    appId: "1:956442371301:web:54609b4caca6cf08c3600c",
    measurementId: "G-FL8JTQ4NEC"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expose sync function globally
  window.cloudSyncExpenses = async function(data) {
    try {
      await setDoc(doc(db, "nawab_kurta", "expenses_backup"), { data: data });
    } catch(e) {
      console.error("Cloud Sync Error:", e);
    }
  };

  // Listen for real-time updates from other devices
  onSnapshot(doc(db, "nawab_kurta", "expenses_backup"), (docSnap) => {
    if (docSnap.exists()) {
      const cloudData = docSnap.data().data || [];
      if (JSON.stringify(cloudData) !== JSON.stringify(readExpenses())) {
        writeExpenses(cloudData);
        if (typeof renderExpenses === 'function') renderExpenses();
      }
    }
  });
</script>

</body>
