<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nawab Kurta - History</title>
<style>
:root{--ink:#171717;--muted:#666;--line:#ddd;--gold:#b58a3b}
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:var(--ink);font:15px system-ui,-apple-system,sans-serif; padding-left: 80px;}
.app{max-width:760px;margin:22px auto;padding:16px}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
h2{font-size:17px;margin:0 0 14px}
input,select{width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;font:inherit;}
button{border:0;border-radius:8px;padding:11px 14px;font:600 14px system-ui;cursor:pointer;transition:opacity 0.2s}
button:active{opacity:0.8}
.primary{background:#171717;color:#fff}.secondary{background:#eee;color:#171717}.danger{background:#fff0f0;color:#a00}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .actions button{flex:1;}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* SIDE NAVIGATION */
.side-nav {
  position: fixed; top: 0; left: 0; bottom: 0; background: #fff; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; padding: 20px 0; z-index: 2500; width: 80px; box-shadow: 2px 0 10px rgba(0,0,0,0.04);
}
.side-nav a {
  background: transparent; color: var(--muted); border: none; padding: 16px 0;
  font-size: 11px; font-weight: 600; display: flex; flex-direction: column; text-decoration: none;
  align-items: center; gap: 6px; cursor: pointer; width: 100%; transition: all 0.2s;
}
.side-nav a svg { width: 24px; height: 24px; fill: currentColor; }
.side-nav a.active { color: var(--ink); background: #f9f9f9; border-left: 3px solid var(--ink); }
.side-nav a:hover:not(.active) { background: #fafafa; color: #333; }

/* HISTORY STYLES */
.search-wrapper{position:relative;margin-top:14px;margin-bottom:8px}
.search-wrapper svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:#888}
.search-wrapper input{padding-left:38px}
.history-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:8px 0;scrollbar-width:none}
.chip{background:#f0f0f0;color:#171717;border:1px solid #ddd;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.chip.active,.chip:hover{background:#171717;color:#fff;border-color:#171717}
.adv-filters{background:#fbfbfb;border:1px solid #eee;border-radius:10px;margin:10px 0;overflow:hidden;}
.adv-filters summary{padding:12px 14px;font-size:13px;font-weight:600;cursor:pointer;color:#171717;}
.adv-filters-content{padding:0 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.history-stats-bar{display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px}
.stats-right{text-align:right} .stats-right small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.history-entry{border-top:1px solid #eee;padding:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;}
.history-entry strong{display:block;font-size:14px;margin-bottom:2px}
.history-entry small{display:block;color:#666;font-size:12px}

/* MODAL / OVERLAY */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:2000;display:flex;align-items:center;justify-content:center;padding:14px}
.detail-card{background:#fff;color:#171717;width:min(440px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:16px;}
.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.detail-receipt{width:100%;max-width:300px;margin:0 auto;background:#fff;border:1px solid #eee;padding:16px 12px;font-family:Arial;}
.app-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:3000;background:#171717;color:#fff;padding:12px 18px;border-radius:999px;transition:opacity .22s,transform .22s;font-size:13px}
.app-toast.show{opacity:1;transform:translate(-50%,0)}
.app-confirm{position:fixed;inset:0;background:#0008;z-index:3100;display:flex;align-items:center;justify-content:center;padding:18px;}
.confirm-card{width:min(340px,100%);background:#fff;border-radius:18px;padding:22px;text-align:center;}

/* OVERRIDES FOR POPUPS */
.app-confirm[hidden] { display: none !important; }
.detail-overlay[hidden] { display: none !important; }

@media(max-width:600px){
  body { padding-left: 65px; } .side-nav { width: 65px; }
  .side-nav a { font-size: 10px; padding: 12px 0; } .side-nav a svg { width: 20px; height: 20px; }
  .history-entry{flex-direction:column;align-items:stretch;}
}
</style>
</head>

<div class="app">
 <section class="panel">
  <h2>Bill History</h2>
  <div class="search-wrapper">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="historySearch" placeholder="Search Bill # or Customer...">
  </div>

  <div class="history-chips">
    <button class="chip" data-range="today">Today</button><button class="chip" data-range="yesterday">Yesterday</button><button class="chip" data-range="thisMonth">This Month</button><button class="chip active" data-range="all">All Time</button>
  </div>

  <details class="adv-filters">
    <summary>Custom Date & Month Filters</summary>
    <div class="adv-filters-content">
      <div><label>From Date</label><input type="date" id="historyFrom"></div>
      <div><label>To Date</label><input type="date" id="historyTo"></div>
      <div><label>Month</label><select id="historyMonth"></select></div>
      <div><label>Year</label><select id="historyYear"></select></div>
    </div>
  </details>

  <div class="history-stats-bar">
    <div>Showing: <strong id="filteredCount">0</strong> bills</div>
    <div class="stats-right">Total: <strong id="filteredSales">₹0.00</strong><small>Cash: <span id="cashSales">₹0.00</span> | Online: <span id="onlineSales">₹0.00</span></small></div>
  </div>

  <div id="historyList" class="note">No bills saved yet.</div>

  <div class="actions" style="margin-top:20px;border-top:1px solid #eee;padding-top:16px;">
    <button class="secondary" id="exportDataBtn">Export Backup</button>
    <button class="secondary" id="importDataBtn">Import Backup</button><input type="file" id="importFile" accept=".json" style="display:none">
    <button class="danger" id="clearHistory">Clear Data</button>
  </div>
 </section>
</div>

<!-- OVERLAYS -->
<div id="billDetailOverlay" class="detail-overlay" hidden>
 <div class="detail-card">
  <div class="detail-top"><h2 id="detailTitle">Bill details</h2><button type="button" class="secondary" onclick="this.closest('.detail-overlay').hidden=true" style="padding:4px 10px">×</button></div>
  <div id="detailReceipt" class="detail-receipt"></div>
  <div class="actions" style="margin-top:14px">
   <button type="button" class="secondary" id="viewReceiptBtn">Print (58mm)</button>
   <button type="button" class="secondary" id="a4ReceiptBtn">Save A4 PDF</button>
   <button type="button" class="primary" id="editBillBtn">Edit Bill</button>
  </div>
 </div>
</div>
<div id="appToast" class="app-toast"></div>
<div id="appConfirm" class="app-confirm" hidden>
 <div class="confirm-card"><h3 id="confirmTitle">Are you sure?</h3><p id="confirmMessage"></p><div class="confirm-actions"><button type="button" class="secondary" id="confirmCancel">Cancel</button><button type="button" class="primary" id="confirmOk">Continue</button></div></div>
</div>

<script>
const HISTORY_KEY='nawabKurtaBillHistory_v1';
const qrData = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKUAAAClCAIAAACySaqNAAADiUlEQVR4nO2dya4bMQzAmqL//8vp3cBTqmoZBySvk3GcEAIEL9Lr/X7/Egy/n56ArKJvFvpmoW8W+mahbxb6ZqFvFvpm8Sd+/Hq9duaRWuY7ZnW8W5lzZaj4J1zyTxrfLPTNQt8s9M3iQ7520Lh5Gucv8dPGrOp4t5JVxVlkPI0KqTkb3yz0zULfLPTNIpevHTQuP6U+nFpfSyV3lTWySgo2908eGN8s9M1C3yz0zaKUr91J4/bo2shrGN8s9M1C3yz0zeLSfG1tX7KyLfuNGN8s9M1C3yz0zaKUr83VAqlscaaeVqbRyFpVFeObhb5Z6JuFvlnk8rW19aa5BK0xuau8+9TKnfHNQt8s9M1C3yxeX1Evd+6SQDxU5ZrqnX+s8c1C3yz0zULfLD7ka5esZMWzirkkm4uprM2lvsj4ZqFvFvpmoW8WH/ZDn7pr2bjONbfstZYJHk8rma/xzULfLPTNQt8scv0N1g7rN25Eru2lxjRmoBWMbxb6ZqFvFvpmUVpfm+sz0LhLG9O4+jZXGqRxK9n4ZqFvFvpmoW8Wj9Vfq5xuq1zbbGRt5MbjbMY3C32z0DcLfbPozNfmTsnPlcqoLKjNNYef+17jm4W+Weibhb5ZlM6vPXXHc+3w11zP09TTyocPjG8W+mahbxb6ZlGql7uWzlRGTtF4OaFyqXNuqc74ZqFvFvpmoW8WpXq5X1F/LWbugkFlGnM3Xo1vFvpmoW8W+max1z/0zvNrFZ7KTz2/Jv+Kvlnom4W+WXSeXzuolLFtrMmxlic2LhHOJaTGNwt9s9A3C32z6Ky/lhrqoJK/XLKnOVfjt/HnG98s9M1C3yz0zaLUPzT+8MHcHc9v7GoaM9cr3vhmoW8W+mahbxal+wZzNLZSn/uitX7vjddFjW8W+mahbxb6ZpE7vzZHqoNBY/n/tXT1qYZbB8Y3C32z0DcLfbPI3Q9dW9hqnMbcNYDGMhspKkMZ3yz0zULfLPTNolTPY66s61Ot4+ORU1xSAfjA+Gahbxb6ZqFvFo/1e49JJVmNt1Yb+0I11uTw/Jr8J/pmoW8W+mZxab7WeOhsrjZG/O6d9YGNbxb6ZqFvFvpmsdffYG7kueK6KeZ2h+Mvsv6a/Ii+Weibhb5ZlPq9zzGXVc2Vyphr+hmTSt+Mbxb6ZqFvFvpmcWn9NRnC+Gahbxb6ZqFvFvpmcWn9NRnC+Gahbxb6ZqFvFvpmoW8W+mahbxb6ZvEX4ttBa+Bj8GgAAAAASUVORK5CYII=";
const money=n=>'₹'+(Number(n)||0).toFixed(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer, confirmResolver;
function toast(msg){ const el=document.getElementById('appToast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400); }
function askConfirm(msg,title='Are you sure?',act='Continue'){ document.getElementById('confirmMessage').textContent=msg;document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmOk').textContent=act;document.getElementById('appConfirm').hidden=false;return new Promise(r=>{confirmResolver=r}); }
function closeConfirm(ans){ document.getElementById('appConfirm').hidden=true;if(confirmResolver)confirmResolver(ans);confirmResolver=null; }
document.getElementById('confirmCancel').onclick=()=>closeConfirm(false); document.getElementById('confirmOk').onclick=()=>closeConfirm(true);

function readHistory(){ try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return []} }
function writeHistory(rows){ localStorage.setItem(HISTORY_KEY,JSON.stringify(rows)) }

function renderHistory(){
  const history = readHistory(), list = document.getElementById('historyList');
  const yearSelect = document.getElementById('historyYear'), monthSelect = document.getElementById('historyMonth');
  
  const years = [...new Set(history.map(b=>(b.date||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(!years.includes(String(new Date().getFullYear()))) years.unshift(String(new Date().getFullYear()));
  yearSelect.innerHTML = '<option value="all">All</option>' + years.map(y=>`<option value="${y}">${y}</option>`).join('');
  
  monthSelect.innerHTML = '<option value="all">All</option>' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('');

  if(!history.length) { list.textContent='No bills saved.'; return; }

  const q = document.getElementById('historySearch').value.toLowerCase(), fD = document.getElementById('historyFrom').value, tD = document.getElementById('historyTo').value;
  const filtered = history.filter(x => {
    const d = x.date||'', y = d.slice(0,4), m = d.slice(5,7);
    const mY = yearSelect.value==='all' || y===yearSelect.value;
    const mM = monthSelect.value==='all' || m===monthSelect.value;
    const mF = !fD || d >= fD, mT = !tD || d <= tD;
    const mQ = !q || (x.billNo&&x.billNo.toLowerCase().includes(q)) || (x.customer&&x.customer.toLowerCase().includes(q));
    return mY && mM && mF && mT && mQ;
  });

  document.getElementById('filteredCount').textContent = filtered.length;
  document.getElementById('filteredSales').textContent = money(filtered.reduce((s,x)=>s+(Number(x.total)||0),0));
  document.getElementById('cashSales').textContent = money(filtered.filter(x=>x.payment==='Cash').reduce((s,x)=>s+(Number(x.total)||0),0));
  document.getElementById('onlineSales').textContent = money(filtered.filter(x=>x.payment==='Online').reduce((s,x)=>s+(Number(x.total)||0),0));

  list.innerHTML = '';
  filtered.forEach(x => {
    const row = document.createElement('div'); row.className = 'history-entry';
    row.innerHTML = `<div><strong>${x.billNo||'Bill'} ${x.customer?`(${x.customer})`:''} · ${money(x.total)}</strong><small>${x.date} ${x.time||''} · ${x.payment||''}</small></div>`;
    const actions = document.createElement('div'); actions.className='actions';
    const view = document.createElement('button'); view.className='secondary'; view.textContent='View'; view.onclick=()=>showBillDetail(x.id);
    const edit = document.createElement('button'); edit.className='primary'; edit.textContent='Edit'; edit.onclick=()=>window.location.href=`bill.html?edit=${x.id}`;
    const del = document.createElement('button'); del.className='danger'; del.textContent='Del'; 
    del.onclick = async()=>{ if(await askConfirm('Delete bill?')){ writeHistory(readHistory().filter(y=>y.id!==x.id)); renderHistory(); toast('Deleted'); } };
    actions.append(view,edit,del); row.append(actions); list.append(row);
  });
}

function showBillDetail(id){
 const x = readHistory().find(y=>y.id===id); if(!x) return;
 document.getElementById('detailReceipt').innerHTML = `<h3 style="margin:0;font-size:18px;text-align:center">NAWAB KURTA</h3><div style="text-align:center;font-size:10px;margin-bottom:10px">KURTA • PAJAMA • PATHANI</div><div style="font-size:11px;display:flex;justify-content:space-between"><span>Bill: ${x.billNo||''}</span><span>${x.date}</span></div>${x.customer?`<div style="font-size:11px">Customer: ${x.customer}</div>`:''}
 <table style="width:100%;font-size:12px;margin:10px 0;border-top:1px dashed #000;border-bottom:1px dashed #000;padding:5px 0"><tr><th style="text-align:left">Item</th><th style="text-align:left">Qty</th><th style="text-align:right">Amt</th></tr>${x.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td style="text-align:right">${money(i.qty*i.price)}</td></tr>`).join('')}</table>
 <div style="font-size:12px;text-align:right">Sub: ${money(x.subtotal)}<br>Disc: ${money(x.discount)}<br><strong style="font-size:14px">Total: ${money(x.total)}</strong><br>Paid via: ${x.payment}</div>
 <div style="text-align:center;font-size:11px;font-weight:bold;margin-top:12px">THANK YOU FOR SHOPPING!</div>
 <div style="text-align:center;font-size:10px;margin-top:4px">Find our store on Google Maps</div>
 <img src="${qrData}" style="display:block;width:100px;height:100px;margin:8px auto 4px;object-fit:contain;">
 <div style="text-align:center;font-size:9px;color:#555;line-height:1.3">G-50/5, High Tension Road<br>Shaheen Bagh, Okhla, New Delhi-110025</div>
 <div style="text-align:center;font-size:10px;margin-top:4px">Please visit us again</div>`;
 document.getElementById('editBillBtn').onclick = () => window.location.href=`bill.html?edit=${id}`;
 document.getElementById('viewReceiptBtn').onclick = () => window.location.href=`bill.html?print=${id}`;
 document.getElementById('a4ReceiptBtn').onclick = () => printA4(x);
 document.getElementById('billDetailOverlay').hidden = false;
}

function printA4(data){
 toast('Generating PDF...');
 const iframe=document.createElement('iframe'); iframe.style='position:absolute;width:0;height:0;border:0;'; document.body.appendChild(iframe);
 const doc=iframe.contentWindow.document; doc.open();
 doc.write(`<html><head><style>@page{size:A4 portrait;margin:15mm} body{font-family:Arial;color:#171717} table{width:100%;border-collapse:collapse;margin-top:24px;font-size:13px} th{background:#f2eee6;text-align:left;padding:12px;border-bottom:1px solid #c8b58f} td{padding:13px 10px;border-bottom:1px solid #e5e5e5} .right{text-align:right} .sum{width:300px;margin:24px 0 0 auto} .sum div{display:flex;justify-content:space-between;padding:8px 0;font-size:13px} .grand{font-size:18px;font-weight:bold;border-top:2px solid #000;padding-top:13px} .a4-footer{text-align:center;margin-top:50px;border-top:1px solid #ddd;padding-top:18px;font-size:13px} .a4-qr{display:block;width:125px;height:125px;object-fit:contain;margin:14px auto 6px}</style></head><body>
 <div style="text-align:center;border-bottom:2px solid #b58a3b;padding-bottom:18px"><h2>NAWAB KURTA</h2><p style="margin:0;font-size:12px;color:#555">KURTA • PAJAMA • PATHANI</p><h3 style="margin-top:15px">CUSTOMER INVOICE</h3></div>
 <div style="display:flex;justify-content:space-between;margin-top:15px"><span>Bill: ${esc(data.billNo)}<br>Date: ${esc(data.date)}</span><span>Customer: ${esc(data.customer||'—')}<br>Payment: ${esc(data.payment)}</span></div>
 <table><tr><th>ITEM</th><th>QTY</th><th class="right">AMOUNT</th></tr>${data.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td class="right">${money(i.qty*i.price)}</td></tr>`).join('')}</table>
 <div class="sum"><div><span>Subtotal</span><span>${money(data.subtotal)}</span></div><div><span>Discount</span><span>${money(data.discount)}</span></div><div class="grand"><span>Total</span><span>${money(data.total)}</span></div></div>
 <div class="a4-footer">
   <strong>THANK YOU FOR SHOPPING!</strong>
   <div>Find our store on Google Maps</div>
   <img class="a4-qr" src="${qrData}">
   <div style="font-size:11px;color:#555;margin:4px 0 8px">G-50/5, High Tension Road, Shaheen Bagh, Okhla, New Delhi - 110025</div>
   Please visit us again
 </div>
 </body></html>`); doc.close();
 setTimeout(()=>{iframe.contentWindow.focus();iframe.contentWindow.print();setTimeout(()=>iframe.remove(),60000)},500);
}

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
 document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
 const t = new Date(), iso = d => d.toISOString().slice(0, 10);
 if(c.dataset.range==='today') { document.getElementById('historyFrom').value=iso(t); document.getElementById('historyTo').value=iso(t); }
 else if(c.dataset.range==='yesterday') { t.setDate(t.getDate()-1); document.getElementById('historyFrom').value=iso(t); document.getElementById('historyTo').value=iso(t); }
 else if(c.dataset.range==='thisMonth') { document.getElementById('historyFrom').value=iso(new Date(t.getFullYear(),t.getMonth(),1)); document.getElementById('historyTo').value=iso(new Date(t.getFullYear(),t.getMonth()+1,0)); }
 else { document.getElementById('historyFrom').value=''; document.getElementById('historyTo').value=''; }
 document.getElementById('historyYear').value='all'; document.getElementById('historyMonth').value='all'; renderHistory();
});

['historySearch','historyFrom','historyTo','historyYear','historyMonth'].forEach(id=>document.getElementById(id).addEventListener('input',renderHistory));

document.getElementById('exportDataBtn').onclick = () => {
 const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(readHistory(), null, 2)], {type: 'application/json'}));
 a.download = `nawab_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
};

document.getElementById('importDataBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
 const r = new FileReader(); r.onload = async(ev) => {
  try { const imported = JSON.parse(ev.target.result);
   if(await askConfirm(`Import ${imported.length} bills?`)){
    const map = new Map(); [...imported, ...readHistory()].forEach(x=>map.set(x.id,x));
    writeHistory(Array.from(map.values()).sort((a,b)=>new Date(b.date)-new Date(a.date)));
    renderHistory(); toast('Import successful');
   }
  } catch(err){toast('Invalid file');} e.target.value=''; 
 }; r.readAsText(e.target.files[0]);
};

document.getElementById('clearHistory').onclick = async() => { if(await askConfirm('Delete ALL history?')){ writeHistory([]); renderHistory(); toast('History cleared'); }};
renderHistory();
</script>
</body>
</html>
